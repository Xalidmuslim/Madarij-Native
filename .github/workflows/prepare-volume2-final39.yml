name: Prepare original Arabic pages 621-659
on:
  push:
    branches: [codex/madarij-v156-volume2-pages621-659-final39-draft]
    paths: [.github/workflows/prepare-volume2-final39.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: python3 tools/prepare_volume2_final39_arabic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/volume2-batch-621-659/original-arabic/
          git diff --cached --check
          git commit -m "research(v2): store four Arabic source files for printed pages 621-659"
          git push origin HEAD:codex/madarij-v156-volume2-pages621-659-final39-draft
