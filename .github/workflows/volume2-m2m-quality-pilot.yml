name: Volume 2 alternate translation quality pilot
on:
  push:
    branches: [codex/madarij-v148-volume2-machine-translation-evaluation]
    paths:
      - tools/evaluate_volume2_m2m.py
      - .github/workflows/volume2-m2m-quality-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies, CPU only
        run: |
          python -m pip install 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 sentencepiece==0.2.0 sacremoses==0.1.1
      - name: Produce limited alternate-model quality sample
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python tools/evaluate_volume2_m2m.py
      - name: Upload samples (never publish automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Volume2-Alternate-M2M-Translation-UNVERIFIED
          path: volume2-pilot-m2m/*
          if-no-files-found: warn
          retention-days: 14
