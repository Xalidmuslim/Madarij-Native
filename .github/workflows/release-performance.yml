name: Madarij Optimized Release R8 + Android QA

on:
  push:
    branches:
      - codex/madarij-v139-reader-toc-layout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madarij-optimized-release
  cancel-in-progress: true

jobs:
  optimized-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact optimized native commit
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle build
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Pillow for pre-rendered static paper assets
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Development signature for isolated Release QA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p development-signing
          keytool -genkeypair -noprompt -keystore development-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Unit tests and optimized R8 Release build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify R8 shrinker, APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -4
          printf 'R8 mapping generated\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Optimized-R8-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM virtualization
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Cold start, scrolling and navigation QA on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/performance_smoke.sh

      - name: Upload emulator performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Performance-QA
          path: performance-results/
          if-no-files-found: warn
          retention-days: 14
