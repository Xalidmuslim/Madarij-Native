name: Import native Madarij source once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-native-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private destination
        uses: actions/checkout@v4
        with:
          path: target
      - name: Checkout immutable original native payloads
        uses: actions/checkout@v4
        with:
          repository: Xalidmuslim/AlFatiha-Native
          ref: 63eb7b0a4f7f36d0736d73d03c4a1f09ac1e5831
          path: legacy
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore native source, with safety checks
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/madarij-native"
          mkdir -p "$STAGE"
          cat legacy/premium-payload/part-*.b64 | base64 -d > "$RUNNER_TEMP/madarij-base.tar.xz"
          cat legacy/premium-payload/ui-overlay-*.b64 | base64 -d > "$RUNNER_TEMP/madarij-overlay.tar.xz"
          base64 -d legacy/premium-payload/reference-fix.b64 > "$RUNNER_TEMP/madarij-reference-fix.tar.xz"
          python3 - <<'PY'
          import os, tarfile
          from pathlib import PurePosixPath
          root = os.environ["RUNNER_TEMP"]
          for name in ("madarij-base.tar.xz","madarij-overlay.tar.xz","madarij-reference-fix.tar.xz"):
              with tarfile.open(os.path.join(root, name), "r:xz") as archive:
                  members = archive.getmembers()
                  for m in members:
                      p = PurePosixPath(m.name)
                      if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                          raise SystemExit(f"Unsafe archive entry in {name}: {m.name}")
                  print(f"Verified {name}: {len(members)} safe members")
          PY
          tar -xJf "$RUNNER_TEMP/madarij-base.tar.xz" -C "$STAGE"
          tar -xJf "$RUNNER_TEMP/madarij-overlay.tar.xz" -C "$STAGE"
          tar -xJf "$RUNNER_TEMP/madarij-reference-fix.tar.xz" -C "$STAGE"
          test -f "$STAGE/app/src/main/AndroidManifest.xml"
          test -f "$STAGE/gradlew"
          test -f "$STAGE/settings.gradle" || test -f "$STAGE/settings.gradle.kts"
          chmod +x "$STAGE/gradlew"
          mkdir -p "$STAGE/development-signing"
          keytool -genkeypair -noprompt -keystore "$STAGE/development-signing/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          sha256sum "$RUNNER_TEMP"/madarij-{base,overlay,reference-fix}.tar.xz
      - name: Run original unit tests and compile verified Android APKs
        working-directory: ${{ runner.temp }}/madarij-native
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease -PpremiumPreview=true --stacktrace --no-daemon
      - name: Stage independently editable source and its own APK workflow
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/madarij-native"
          test -s "$STAGE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$STAGE/app/build/outputs/apk/release/app-release.apk"
          unzip -t "$STAGE/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$STAGE/app/build/outputs/apk/release/app-release.apk"
          mkdir -p target/.github/workflows
          tar -C "$STAGE" --exclude=.git --exclude=.gradle --exclude=build --exclude='*/build' --exclude=development-signing --exclude='*.keystore' --exclude='*.jks' --exclude=local.properties --exclude=.github --exclude=.idea --exclude='*.apk' --exclude='*.aab' -cf - . | tar -C target -xf -
          test -f target/app/src/main/AndroidManifest.xml
          test -f target/gradlew
          chmod +x target/gradlew
          cat > target/MIGRATION_PROVENANCE.md <<'EOF'
          # Source provenance
          
          This independent Android project was restored, without rewriting application logic,
          from the existing Madarij build archives in public repository
          `Xalidmuslim/AlFatiha-Native`, pinned to git commit
          `63eb7b0a4f7f36d0736d73d03c4a1f09ac1e5831` in branch `madarij-v116-premium-20261007`.
          
          The original reconstruction sequence was:
          1. `premium-payload/part-*.b64` — base tar.xz
          2. `premium-payload/ui-overlay-*.b64` — UI overlay tar.xz
          3. `premium-payload/reference-fix.b64` — reference fix tar.xz
          
          The imported source passed the original native Gradle unit tests and
          debug/release compilation in GitHub Actions before being committed here.
          
          Build-generated outputs, generated test keystores, Gradle caches, and other
          local build artifacts were explicitly excluded from source control.
          The original repository and its branch are unchanged.
          
          NOTE: Development APK signing uses a temporary test key. For upgrading
          existing installed versions without removing app data, configure persistent,
          secure signing keys in a separate release pipeline.
          EOF
          # APK workflow will be installed separately using the authorized GitHub connector.
          # GitHub Actions GITHUB_TOKEN cannot create/update files under .github/workflows.
      - name: Upload verified migration test APKs
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Migration-Test-APK
          path: |
            ${{ runner.temp }}/madarij-native/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/madarij-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified source to independent repository
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes to commit"; exit 0; }
          git diff --cached --name-only | head -80
          git commit -m "feat: import verified Madarij native Android source"
          git push origin HEAD:main
