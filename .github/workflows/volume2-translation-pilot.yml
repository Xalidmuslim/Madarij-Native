name: Volume 2 translation model pilot
on:
  push:
    branches: [codex/madarij-v148-volume2-machine-translation-evaluation]
    paths:
      - tools/translate_volume2_machine.py
      - .github/workflows/volume2-translation-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madarij-volume2-model-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only open translation model
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.51.3 sentencepiece==0.2.0 sacremoses==0.1.1
      - name: Translate three printed pages for quality evaluation
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python tools/translate_volume2_machine.py --first-page 7 --last-page 9 --shards 1 --shard 0 --output volume2-pilot/pilot.jsonl
      - name: Upload Arabic/Russian examples and audit (not verified)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Volume2-Machine-Translation-Pilot-Unverified
          path: volume2-pilot/*
          if-no-files-found: warn
          retention-days: 30
