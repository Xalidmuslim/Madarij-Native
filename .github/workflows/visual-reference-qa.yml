name: Visual reference screenshots

on:
  push:
    branches: ['codex/antique-book-reference-2026-10-09']

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK for native build
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare development signing
        run: |
          chmod +x gradlew
          mkdir -p development-signing
          keytool -genkeypair -noprompt -keystore development-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build native APK for emulator
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture native screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            mkdir -p reference-qa
            adb shell wm size 432x960
            adb shell wm density 160
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ru.madarij.nativeapp/.MainActivity
            sleep 16
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png reference-qa/home.png
            adb shell input tap 130 910
            sleep 5
            adb shell screencap -p /sdcard/contents.png
            adb pull /sdcard/contents.png reference-qa/contents.png
            adb shell input tap 350 533
            sleep 5
            adb shell screencap -p /sdcard/reader.png
            adb pull /sdcard/reader.png reference-qa/reader.png
      - name: Upload actual device screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Visual-QA-Screenshots
          path: reference-qa/*.png
          retention-days: 14
          if-no-files-found: error
