name: Madarij Native APK

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Also build the optional isolated premium preview APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: madarij-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify source alignment and paragraph boundaries of draft volume 2
        run: python3 tools/validate_volume2_preview.py
      - name: Check every TOC topic and precise reader landmark
        run: python3 tools/validate_toc_anchors.py
      - name: Test volume-2 corrections and previous repairs
        run: python3 -m unittest -v tools/test_volume2_pages003_005.py tools/test_volume2_pages006_009.py tools/test_volume2_pages010_012.py tools/test_volume2_pages013_020.py tools/test_volume2_collation_4pages.py
      - name: Prepare licensed Russian handwriting font
        run: python3 tools/prepare_handwriting_font.py

      - name: Install Pillow for pre-rendered static paper assets
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Development signing for test-only builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p development-signing
          keytool -genkeypair -noprompt -keystore development-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      # Every PR, main update and manual run must deliver the same optimized
      # release variant used for performance acceptance. Debug remains solely
      # the target of unit tests; it is never offered as the user's new APK.
      - name: Build optimized native Android Release (R8)
        # Development-signed test packages need isolated IDs: reusing the
        # production app ID with a new ephemeral key prevents safe upgrades.
        run: ./gradlew :app:assembleRelease -PciIsolatedRelease=true --no-daemon --stacktrace
      - name: Verify R8 mapping, package, integrity and development signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          test -s app/build/outputs/mapping/release/mapping.txt
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > release-badging.txt
          grep -q "package: name='ru.madarij.nativeapp.collation158'" release-badging.txt
          printf 'Optimized R8 release (development signing; isolated package)\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify bilingual volume-2 data in R8 Release APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -p app/build/outputs/apk/release/app-release.apk assets/volume2-preview.json > /tmp/volume2-apk.json
          python3 - <<'PY'
          import json
          with open('/tmp/volume2-apk.json',encoding='utf-8') as f: x=json.load(f)
          p={v['id']:v for c in x['chapters'] for v in c['paragraphs']}
          assert len(p)==676 and len(x['chapters'])==9
          assert p['madarij-v2-p003-a']['ar'].startswith('فصل في مشاهد الخلق في المعصية')
          assert 'высовывает язык' in p['madarij-v2-p004-02']['ru']
          assert 'по приводимому им выражению' not in p['madarij-v2-p005-06']['ru']
          assert 'дозволено убить его таким же способом' in p['madarij-v2-p007-c']['ru']
          assert 'вправе убить виновного' in p['madarij-v2-p007-d']['ru']
          assert 'питающее подобно питающемуся' in p['madarij-v2-p010-e']['ru']
          assert 'по словам автора' not in p['madarij-v2-p013-draft']['ru']
          assert 'как утверждает автор' not in p['madarij-v2-p015-draft']['ru']
          assert not x['publication_ready']
          print('PASS: unchanged, verifiable volume-two printed text in R8 Release')
          PY
      - name: Upload installable optimized Release APK (not Debug)
        uses: actions/upload-artifact@v4
        id: release
        with:
          name: Madarij-Optimized-R8-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: R8 download and signing warning
        env:
          APK_URL: ${{ steps.release.outputs.artifact-url }}
        run: |
          echo "[Download optimized R8 Release APK]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: CI uses an ephemeral development keystore. Do not replace existing user installs signed by another key." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify performance-gate parser
        run: python3 -m unittest -v tools/test_performance_gate.py
      - name: Enable Android emulator KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Release Cold Start, reader navigation and scrolling QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/performance_smoke.sh
      - name: Evaluate performance regression thresholds
        run: python3 tools/performance_gate.py --measurements performance-results/measurements.txt --gfxinfo performance-results/gfxinfo.txt --report performance-results/summary.md
      - name: Upload performance evidence even when QA fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-R8-Performance-QA
          path: performance-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Optional premium preview Release (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: ./gradlew :app:assembleRelease -PpremiumPreview=true --no-daemon --stacktrace
      - name: Upload optional premium preview Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Premium-Preview-R8-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
