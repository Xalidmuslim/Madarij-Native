name: Madarij Native APK

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: 'Run unit tests and build the release preview as well'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: madarij-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout native source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Pillow for pre-rendered static paper assets
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Development signing for test-only builds
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p development-signing
          keytool -genkeypair -noprompt -keystore development-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Fast build of native Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        id: apk
        with:
          name: Madarij-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: APK download link
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: echo "[Download Madarij debug APK archive]($APK_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Full checks (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PpremiumPreview=true --no-daemon --stacktrace
      - name: Verify release preview (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload release preview (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_checks }}
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Native-Release-Preview-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
