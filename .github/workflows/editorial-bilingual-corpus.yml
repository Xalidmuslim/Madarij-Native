name: Literary Russian before-after review (no APK)

on:
  push:
    branches:
      - 'editorial/**'
    paths:
      - 'research/editorial/**'
      - 'tools/build_reviewed_bilingual.py'
      - 'tools/render_reviewed_bilingual.py'
      - 'tools/test_reviewed_bilingual.py'
      - 'tools/render_russian_changes.py'
      - 'tools/test_russian_comparison.py'
      - 'tools/prepare_russian_reader_assets.py'
      - 'tools/test_russian_reader_assets.py'
      - '.github/workflows/editorial-bilingual-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madarij-literary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bilingual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected canonical corpus and editable manifests
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all editorial changes and Russian before-after comparison
        run: python3 -m unittest -v tools.test_reviewed_bilingual tools.test_russian_comparison
      - name: Test next APK's Russian-only assets without compiling an APK
        run: |
          python3 tools/build_volume4_assets.py
          python3 -m unittest -v tools.test_russian_reader_assets
      - name: Generate full-volume bilingual JSON and offline comparison HTML
        run: |
          python3 tools/build_reviewed_bilingual.py
          python3 -m tools.render_reviewed_bilingual
      - name: Generate Russian before-after JSON and offline HTML
        run: python3 -m tools.render_russian_changes
      - name: Package comparison files only (never compile Android)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p editorial-download
          cp research/editorial/volume1/russian-before-after.html editorial-download/
          cp research/editorial/volume1/russian-before-after.json editorial-download/
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('editorial-download/russian-before-after.json').read_text())
          assert data['totalSections']==90 and data['totalParagraphs']==740
          assert data['reviewedSections']==35 and data['editedParagraphs']==224
          assert data['corrections']==356 and all('ar' not in c for c in data['changes'])
          print('PASS: old and new Russian only; 224 revised paragraphs; 356 anchored edits')
          PY
      - name: Upload full first volume for direct comparison
        uses: actions/upload-artifact@v4
        with:
          name: Madarij-Volume1-Russian-BeforeAfter-Sections01-35
          path: editorial-download/
          if-no-files-found: error
          retention-days: 90
